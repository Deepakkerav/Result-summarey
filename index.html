<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
     <div class="wrapper">
       <div class="result-side">
        <h3 class="result-heading">Your Result</h3>
         <div class="result">
           <div class="result-score">76 </div>
            <div class="result-outof">of 100</div>
         </div>
         <div class="win-msg">Great</div>
         <div class="result-description">You ssored higher than 65% of the people who have take these test.</div>
        </div>
        
        <div class="summary-side">
         <div class="summary-heading">Summar</div>
           <div class="summary-item">

              <div class="item1">
                <div class="reaction">
                    <img src="assets/images/icon-reaction.svg" alt="reaction">
                    <p>Reaction</p>
                </div>
                <div class="summary-score">
                  <p class="score"><span>80</span> / 100</p>
                </div>
              </div>

              <div class="item2">
                <div class="memory">
                  <img src="assets/images/icon-memory.svg" alt="memory">
                  <p>Memory</p>
                </div>
                <div class="memory-score">
                  <p class="score"><span>89</span> / 100</p>
                </div>
              </div>

              <div class="item3">
                 <div class="verbal">
                <img src="./assets/images/icon-verbal.svg" alt="Verbal" />
                <p>Verbal</p>
                 </div>
              <div class="summary-score">
                <p class="score"><span>61</span> / 100</p>
              </div>
            </div>

            <div class="item4">
              <div class="visual">
                <img src="./assets/images/icon-visual.svg" alt="Visual" />
                <p>Visual</p>
              </div>
              <div class="summary-score">
                <p class="score"><span>73</span> / 100</p>
              </div>
            </div>

          </div>
          <button class="continue-btn">Continue</button>
         </div>
  
     </div>
    </div>
</body>
</html>
